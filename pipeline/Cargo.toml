[package]
name = "memmap"
version = "0.8.0"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2024"

[dependencies]
image = "0.25"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "checked-decode"] }
ndarray = { version = "0.17", optional = true }
ort = { version = "2.0.0-rc.15", optional = true }
rayon = "1"
serde_json = "1.0.154"
# 한 프로세스 모드(--slam): 위치 프로그램을 라이브러리로 부르고 장면을 메모리로 받음
slam = { path = "../slam" }
# --serve: 뷰어 서버(sgview)를 같은 프로세스에서, 자주 바뀌는 기억 파일은 메모리로 넘김
sgview = { path = "../viewer/sgview" }

# 리눅스(보드): --slam --realsense 의 D435 입력은 rsdriver(V4L2 직접)가 기본
[target.'cfg(target_os = "linux")'.dependencies]
slam = { path = "../slam", features = ["rsdriver"] }

[features]
default = ["onnx"]
onnx = ["dep:ort", "dep:ndarray"]
# 윈도우 PC 그래픽카드(DirectML)로 ONNX 모델 실행
directml = ["onnx", "ort/directml"]
dxrt = []
# --slam --realsense(한 프로세스 D435 입력)
slam-realsense = ["slam/realsense"]

[[bin]]
name = "memmap"
path = "src/main.rs"

# 한 명령: ondevice [run] … = memmap, ondevice slam … = slam_bridge, ondevice view … = sgview (같은 main.rs)
[[bin]]
name = "ondevice"
path = "src/main.rs"
