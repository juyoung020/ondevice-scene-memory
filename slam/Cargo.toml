[package]
name = "slam"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2024"
description = "위치 추적 부품: D435 적외선 좌우 + IMU → ORB-SLAM3 스테레오-관성 → 장면 스트림(위치 · 루프 보정으로 움직인 노드). 같은 프로세스의 물체 기억에는 메모리 큐로 넘긴다."
build = "build.rs"

[dependencies]
common = { path = "../common" }
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1"
rsdriver = { path = "../rsdriver", optional = true }

[build-dependencies]
cc = "1"

[features]
default = []
# D435 입력(rsdriver: V4L2·UVC 직접)
rsdriver = ["dep:rsdriver"]
# ORB-SLAM3 스테레오-관성 백엔드(C++ 원본을 ORB_SLAM3_DIR 에서 링크, 기본 ~/ext/ORB_SLAM3)
orb3 = []
