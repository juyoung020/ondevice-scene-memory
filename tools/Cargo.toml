[package]
name = "tools"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2024"
description = "깊이 → 컬러 정렬 라이브러리 fast_align(librealsense rs2::align 과 비트 단위로 같은 결과)과 RealSense·IMU 도구."

[lib]
name = "tools"
path = "src/lib.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
common = { path = "../common" }


[[bin]]
name = "bench_align"
path = "src/bin/bench_align.rs"

[[bin]]
name = "imu_probe"
path = "src/bin/imu_probe.rs"

[[bin]]
name = "npu_prep"
path = "src/bin/npu_prep.rs"


