; RTAB-Map 0.24.2, Raspberry Pi 5 + RealSense D435(IMU 없음), 손카메라 30 장/초 설정.
; 근거: docs/rtabmap_tuning.md (PC 코어 하나에서 위치 추적 9.5 ms/장, 사무실 2.6 cm, D435 복도 0.21 m, fr1 책상 놓침 없음)
; 여기 없는 파라미터는 기본값.
; 위치 추적 = 광류(Odom/Strategy=9, slam/src/klt.rs): 장면마다 기술자·짝짓기·묶음 조정 없이 광류 + PnP, 보드 1.5 ms/장(D435 실시간).
;   빠르게 흔들어도: 등속 예측으로 광류 시작점을 잡고, 광류가 끊기면 같은 장면에서 마지막 키프레임과 기술자 맞추기로 바로 되찾음.
;   TUM fr1 빠른 시퀀스 2–3 배 건너뛰기에서 놓침 0(F2F 는 fr1_room 2 배 73 장 · 3 배 54 장), docs/performance_log.md "빠른 움직임".
; 놓친 뒤에는 새 지도를 열지 않고 마지막 위치에서 같은 지도로 이어 붙인다(slam 명령 --no-bridge 로 예전처럼 새 지도).
; 카메라(rsdriver): 기본 --camera-profile librealsense = librealsense 와 같은 컬러 제어(docs/realsense_input.md "컬러 제어").
;   --camera-profile tracking(60 Hz · 노출 상한 16.6 ms · 감도 보충)은 번짐이 줄지만 어두운 방에서 너무 어두움. 640x480@60 도 됨(--fps 60).
[Core]
Rtabmap/DetectionRate=1
Rtabmap/CreateIntermediateNodes=false
Odom/Strategy=9
; 광류 경로 파라미터(기본값): OdomKlt/RedetectRatio=0.6(점이 이 비율 아래로 줄면 키프레임·점 채움), OdomKlt/KeepError=3(px), OdomKlt/Iterations=100(PnP RANSAC)
; RTAB-Map 그대로의 F2F(비교용·출력 바이트 동일 경로): Odom/Strategy=1
Odom/VisKeyFrameThr=60
Odom/ImageDecimation=1
Vis/MaxFeatures=400
Kp/MaxFeatures=300
Reg/Force3DoF=false
; 특징 GFTT/BRIEF·최적화기 GTSAM: 빌드 기본값에 맡기지 않고 적음(OpenCV contrib + GTSAM 빌드 필요, docs/board_bridge.md)
Vis/FeatureType=6
Kp/DetectorStrategy=6
Optimizer/Strategy=2

; RTAB-Map F2M(정확도 우선, 장면당 +3 ms·보드 약 +9 ms, 사무실 1.9–2.0 cm): 위 Odom/Strategy·Odom/VisKeyFrameThr 두 줄을 아래로 바꿈
;Odom/Strategy=0
;Odom/VisKeyFrameThr=150
;OdomF2M/MaxSize=1000
;OdomF2M/BundleAdjustmentMaxFrames=3
