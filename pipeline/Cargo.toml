[package]
name = "ondevice"
version = "0.9.0"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
image = "0.25"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "checked-decode"] }
rayon = "1"
serde_json = "1.0.154"
# --slam: 위치 프로그램(slam)을 라이브러리로 부르고 장면을 메모리로 받음
slam = { path = "../slam" }
# --serve: 뷰어 서버(sgview)를 같은 프로세스에서, 기억 폴더에 쓴 파일은 메모리로 넘김
sgview = { path = "../viewer/sgview", default-features = false }
# --features mimalloc: 할당기를 mimalloc 으로(장면마다 크고 작은 버퍼를 잡고 놓는 비용·조각남 줄임). 값은 같음
mimalloc = { version = "0.1", default-features = false, optional = true }

# 리눅스(보드): --slam --realsense 의 D435 입력은 rsdriver(V4L2 직접)가 기본
[target.'cfg(target_os = "linux")'.dependencies]
slam = { path = "../slam", features = ["rsdriver"] }

[features]
default = ["onnx"]
# PC: .onnx 모델(분할 · 사진 벡터 · 루프)을 Rust 실행기(common::nn)로, 글 검색
onnx = ["slam/onnx", "sgview/search"]
dxrt = ["common/dxrt", "sgview/dxrt", "slam/dxrt"]
mimalloc = ["dep:mimalloc"]

# 한 프로그램: ondevice [run] … = 물체 기억(memmap), ondevice slam … = 위치 프로그램, ondevice view … = 뷰어 서버
[[bin]]
name = "ondevice"
path = "src/main.rs"
