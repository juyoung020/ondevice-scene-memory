[package]
name = "slam"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2024"
description = "위치 추적: ORB-SLAM3 RGB-D(cpp/orb3.cc 래퍼, 같은 프로세스 백엔드)와 RTAB-Map 0.24.2 경로를 Rust 로 옮긴 것(`ondevice slam`). 장면 스트림(또는 같은 프로세스의 메모리 큐)으로 물체 기억에 보낸다."
build = "build.rs"
# 링크 폴더를 실행 파일(pipeline)에 rpath 로 넘김(DEP_ORB3_RPATH)
links = "orb3"

[dependencies]
common = { path = "../common" }
nalgebra = "0.33"
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1"
rsdriver = { path = "../rsdriver", optional = true }
# 루프 · 재위치 신경망(PC): ONNX Runtime(common 과 같은 판)
ort = { version = "=2.0.0-rc.15", optional = true }

[build-dependencies]
cc = "1"

[features]
default = []
# D435 입력(rsdriver: V4L2·UVC 직접)
rsdriver = ["dep:rsdriver"]
# 루프 · 재위치 신경망 실행기(nnrun): PC = ONNX Runtime, 보드 = DXRT
onnx = ["dep:ort", "common/onnx"]
dxrt = ["common/dxrt"]
