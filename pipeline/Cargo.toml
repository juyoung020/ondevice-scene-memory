[package]
name = "ondevice"
version = "0.8.0"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
image = "0.25"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "checked-decode"] }
ndarray = { version = "0.17", optional = true }
ort = { version = "2.0.0-rc.15", optional = true }
rayon = "1"
serde_json = "1.0.154"
# --slam: 위치 프로그램(slam)을 라이브러리로 부르고 장면을 메모리로 받음
slam = { path = "../slam" }
# --serve: 뷰어 서버(sgview)를 같은 프로세스에서, 기억 폴더에 쓴 파일은 메모리로 넘김
sgview = { path = "../viewer/sgview" }
# --features mimalloc: 할당기를 mimalloc 으로(장면마다 크고 작은 버퍼를 잡고 놓는 비용·조각남 줄임). 값은 같음
mimalloc = { version = "0.1", default-features = false, optional = true }

# 리눅스(보드): --slam --realsense 의 D435 입력은 rsdriver(V4L2 직접)가 기본
[target.'cfg(target_os = "linux")'.dependencies]
slam = { path = "../slam", features = ["rsdriver"] }

[features]
default = ["onnx"]
onnx = ["dep:ort", "dep:ndarray", "common/onnx"]
# 윈도우 PC 그래픽카드(DirectML)로 ONNX 모델 실행
directml = ["onnx", "ort/directml"]
dxrt = []
# --slam --realsense 를 librealsense2 로(rsdriver 와 견줄 때)
slam-realsense = ["slam/realsense"]
mimalloc = ["dep:mimalloc"]

# 한 프로그램: ondevice [run] … = 물체 기억(memmap), ondevice slam … = 위치 프로그램, ondevice view … = 뷰어 서버
[[bin]]
name = "ondevice"
path = "src/main.rs"
