[package]
name = "tools"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2024"
description = "깊이 → 컬러 정렬 라이브러리 fast_align(librealsense rs2::align 과 비트 단위로 같은 결과)과 RealSense·IMU 도구."

[lib]
name = "tools"
path = "src/lib.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = []
# librealsense2 와 견주는 도구(C API 를 직접 부름: rs_align_check · align_sdk_check)
realsense = []


[[bin]]
name = "bench_align"
path = "src/bin/bench_align.rs"

[[bin]]
name = "imu_probe"
path = "src/bin/imu_probe.rs"

[[bin]]
name = "check_tum"
path = "src/bin/check_tum.rs"

[[bin]]
name = "rs_align_check"
path = "src/bin/rs_align_check.rs"
required-features = ["realsense"]

[[bin]]
name = "align_sdk_check"
path = "src/bin/align_sdk_check.rs"
required-features = ["realsense"]
