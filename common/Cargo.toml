[package]
name = "common"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2024"
description = "ondevice 크레이트들이 함께 쓰는 것: 명령줄 읽기, 스레드 배치(우선순위·코어 묶기), TUM 목록, 사원수, PNG·PLY 바이트, ONNX 모델 Rust 실행기(nn)."

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1"

[features]
default = []
# DX-M1 NPU(DXRT C API, libdxrt 링크)
dxrt = []
