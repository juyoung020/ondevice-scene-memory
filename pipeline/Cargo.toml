[package]
name = "memmap"
version = "0.1.0"
edition = "2024"

[dependencies]
image = "0.25"
ndarray = { version = "0.17", optional = true }
ort = { version = "2.0.0-rc.15", optional = true }
rayon = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

v4l = { version = "0.14", optional = true }

[features]
default = ["onnx"]
onnx = ["dep:ort", "dep:ndarray"]
# 윈도우 PC 그래픽카드(DirectML)로 ONNX 모델 실행
directml = ["onnx", "ort/directml"]
dxrt = []
cam = ["dep:v4l"]

[[bin]]
name = "onnx_info"
path = "src/bin/onnx_info.rs"
required-features = ["onnx"]
