; RTAB-Map, 리눅스 PC + RealSense D435 손카메라 실시간 설정(보드용 rtabmap_pi.ini 보다 특징을 더 쓰고 놓침에 너그러움).
; 근거: docs/performance_log.md "리눅스 노트북 + D435 실시간". 여기 없는 파라미터는 기본값.
[Core]
Rtabmap/DetectionRate=1
Rtabmap/CreateIntermediateNodes=false
; 지도 대조(F2M) 위치 추적: 최근 특징 지도에 맞춰 흔들림·가림에 강함
Odom/Strategy=0
Odom/VisKeyFrameThr=150
OdomF2M/MaxSize=2000
OdomF2M/BundleAdjustmentMaxFrames=3
Odom/ImageDecimation=1
; 놓쳐도 30 장(1 초)은 같은 지도에서 다시 잡기를 기다린 뒤에 새 지도로
Odom/ResetCountdown=30
Vis/MaxFeatures=1000
Vis/MinInliers=12
Kp/MaxFeatures=500
Reg/Force3DoF=false
Vis/FeatureType=6
Kp/DetectorStrategy=6
Optimizer/Strategy=2
