[package]
name = "memmap"
version = "0.1.0"
edition = "2024"

[dependencies]
image = "0.25"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
ndarray = { version = "0.17", optional = true }
ort = { version = "2.0.0-rc.15", optional = true }
rayon = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

v4l = { version = "0.14", optional = true }

[features]
default = ["onnx"]
onnx = ["dep:ort", "dep:ndarray"]
# 윈도우 PC 그래픽카드(DirectML)로 ONNX 모델 실행
directml = ["onnx", "ort/directml"]
dxrt = []
cam = ["dep:v4l"]

[[bin]]
name = "onnx_info"
path = "src/bin/onnx_info.rs"
required-features = ["onnx"]

[profile.release]
# 크레이트마다 한 덩어리로 최적화: 인라인이 코드 배치에 따라 달라지지 않게(PC 분할 단계가 빌드마다 1 ms 넘게 흔들렸다)
codegen-units = 1
