; RTAB-Map 0.24.2, Raspberry Pi 5 + RealSense D435(IMU 없음), 손카메라 30 장/초 설정.
; 근거: docs/rtabmap_tuning.md (PC 코어 하나에서 위치 추적 9.5 ms/장, 사무실 2.6 cm, D435 복도 0.21 m, fr1 책상 놓침 없음)
; 여기 없는 파라미터는 기본값.
[Core]
Rtabmap/DetectionRate=1
Rtabmap/CreateIntermediateNodes=false
Odom/Strategy=1
Odom/VisKeyFrameThr=60
Odom/ImageDecimation=1
Vis/MaxFeatures=400
Kp/MaxFeatures=300
Reg/Force3DoF=false
; 특징 GFTT/BRIEF·최적화기 GTSAM: 빌드 기본값에 맡기지 않고 적음(OpenCV contrib + GTSAM 빌드 필요, docs/board_bridge.md)
Vis/FeatureType=6
Kp/DetectorStrategy=6
Optimizer/Strategy=2

; 정확도 우선(장면당 +3 ms·보드 약 +9 ms라 30 장/초 아래로, 사무실 1.9–2.0 cm): 위 Odom/Strategy·Odom/VisKeyFrameThr 두 줄을 아래로 바꿈
;Odom/Strategy=0
;Odom/VisKeyFrameThr=150
;OdomF2M/MaxSize=1000
;OdomF2M/BundleAdjustmentMaxFrames=3
